[project]
name = "embodied"
version = "0.1.0"
description = "NAO 具身智能交互（Python 3 + qi）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4.0.5",
    "pillow>=10",
    "pydantic>=2",
    "pydantic-settings>=2",
    "qi>=3.1.5; sys_platform != 'win32'",
    "libqi-windows>=4.0.1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
embodied = "embodied.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
