[project]
name = "embodied"
version = "0.1.0"
description = "NAO 具身智能交互（Python 3 + qi）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qi>=3.1.5",
]

[project.scripts]
embodied = "embodied:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
